[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_engineer"
version = "1.0.0"
requires-python = "==3.11.*"
dependencies = [
    "fastapi[standard]==0.115.0",
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "python-dotenv>=1.0,<2",
    "chromadb==1.5.9",
    "fastembed==0.8.1",
    "PyYAML==6.0.3",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false
