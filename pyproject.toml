[project]
name = "ai_engineer"
version = "1.0.0"
requires-python = "==3.10.*"
dependencies = [
    "fastapi[standard]==0.115.0",
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "python-dotenv>=1.0,<2",
    "chromadb==1.5.9",
    "sentence-transformers==5.2.2",
    "transformers==5.1.0",
    "numpy==1.26.4",
    "PyYAML==6.0.3",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false
